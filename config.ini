; Конфигурация инструмента визуализации графа зависимостей (NuGet).
; Строки-комментарии начинаются с ; или #.
[depgraph]
; Имя анализируемого пакета (идентификатор NuGet).
package_name = Newtonsoft.Json
; URL репозитория (NuGet v3 index) или путь к файлу тестового репозитория.
repository = https://api.nuget.org/v3/index.json
; Режим работы с тестовым репозиторием: true или false.
test_mode = false
; Версия пакета.
package_version = 13.0.3
; Пакеты, в имени которых есть эта подстрока, пропускаются (можно не задавать).
filter_substring = Test
